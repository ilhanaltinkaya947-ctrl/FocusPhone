name: FocusPhone
options:
  bundleIdPrefix: com.ilhan
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.2"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    DEVELOPMENT_TEAM: 2W3NRPZS9S
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    COPY_PHASE_STRIP: NO
    DEAD_CODE_STRIPPING: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNREACHABLE_CODE: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES

targets:
  RawDog:
    type: application
    platform: iOS
    sources:
      - path: FocusPhone
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilhan.rawdog
        PRODUCT_NAME: RawDog
        INFOPLIST_FILE: FocusPhone/Info.plist
        CODE_SIGN_ENTITLEMENTS: FocusPhone/FocusPhone.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - target: DeviceActivityMonitorExtension
      - target: ShieldConfigurationExtension
      - target: ContentBlockerExtension
      - target: RawDogWidget

  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityMonitorExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilhan.rawdog.dam
        PRODUCT_NAME: DeviceActivityMonitorExtension
        INFOPLIST_FILE: DeviceActivityMonitorExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeviceActivityMonitorExtension/DeviceActivityMonitorExtension.entitlements
        GENERATE_INFOPLIST_FILE: false

  ShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfigurationExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilhan.rawdog.shield
        PRODUCT_NAME: ShieldConfigurationExtension
        INFOPLIST_FILE: ShieldConfigurationExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldConfigurationExtension/ShieldConfigurationExtension.entitlements
        GENERATE_INFOPLIST_FILE: false

  ContentBlockerExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ContentBlockerExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilhan.rawdog.contentblocker
        PRODUCT_NAME: ContentBlockerExtension
        INFOPLIST_FILE: ContentBlockerExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ContentBlockerExtension/ContentBlockerExtension.entitlements
        GENERATE_INFOPLIST_FILE: false

  RawDogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusPhoneWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilhan.rawdog.wgt
        PRODUCT_NAME: RawDogWidget
        INFOPLIST_FILE: FocusPhoneWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: FocusPhoneWidget/FocusPhoneWidget.entitlements
        GENERATE_INFOPLIST_FILE: false
