name = "focusphone-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Secrets (set via `wrangler secret put`):
#   GEMINI_API_KEY    — Google Gemini API key
#   ANTHROPIC_API_KEY — Anthropic API key (for /v1/vision photo verification)
#   APP_SECRET        — shared secret the iOS app sends as Bearer token
